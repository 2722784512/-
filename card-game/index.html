<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的卡牌游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a472a;
            font-family: "Microsoft YaHei", sans-serif;
            color: white;
            padding: 40px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 36px;
        }
        .card-area {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            width: 160px;
            height: 230px;
            background-color: #fff;
            color: #222;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🃏 卡牌游戏测试页面</h1>
        <div class="card-area">
            <div class="card">卡牌 A</div>
            <div class="card">卡牌 B</div>
            <div class="card">卡牌 C</div>
            <div class="card">卡牌 D</div>
        </div>
    </div>
</body>
</html>
